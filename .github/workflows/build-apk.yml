name: Build Mimi Weather APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No project ZIP found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          if [ -f extracted/gradlew ]; then
            PROJECT_DIR=extracted
          else
            PROJECT_DIR=$(find extracted -maxdepth 2 -type f -name gradlew -print -quit | xargs dirname)
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mimi-Weather-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
